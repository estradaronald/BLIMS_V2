<!-- frontend/src/pages/teacher/teacher-grades.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Teacher - Grades</title>

  <!-- ✅ Prevent sidebar "flash" on load (TEACHER key) -->
  <script>
    (function () {
      try {
        const collapsed =
          localStorage.getItem("teacher_sidebar_collapsed_v1") === "1";
        if (collapsed) document.documentElement.classList.add("sb-collapsed");
      } catch {}
    })();
  </script>

  <!-- Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">

 
  <link rel="stylesheet" href="../../styles/admin/sidebar.css" />
  <link rel="stylesheet" href="../../styles/admin/admin-dashboard.css" />
  <link rel="stylesheet" href="../../styles/teacher/teacher-grades.css" />
</head>

<body data-page="teacher-grades">
  <!-- floating collapse button -->
  <button
    class="sidebar-float-toggle"
    id="sidebarFloatToggle"
    type="button"
    aria-label="Toggle sidebar"
  >
    ←
  </button>

  <div class="app">
    <div id="sidebar-mount"></div>

    <main class="content">
      <!-- TOPBAR -->
      <header class="topbar">
      <!-- LEFT (empty spacer to keep layout consistent across pages) -->
      <div class="topbar-left"></div>

      <!-- RIGHT -->
      <div class="topbar-right">
        <button class="tb-icon" type="button" title="Notifications">🔔</button>

        <div class="tb-user" id="userbox">
          <img class="tb-avatar" src="../../assets/images/bg.jpg" alt="avatar" />
          <div class="tb-meta">
            <div class="tb-name">Teacher</div>
            <div class="tb-role" id="tbRole">Advisory Class</div>
          </div>

          <button class="tb-drop" id="userMenuBtn" type="button">▾</button>

          <div class="tb-menu" id="userMenu">
            <button class="tb-item" type="button">Settings</button>
            <button class="tb-item danger" type="button" id="topbarLogout">Logout</button>
          </div>
        </div>
      </div>
    </header>


      <!-- PAGE -->
      <!-- ✅ Match My Schedule page header structure -->
      <section class="gr-page ms-page">
        <!-- ✅ Same title hook as Schedule -->
        <div class="gr-page-title ms-title" id="grTitle">Grades</div>

        <div class="gr-grid">
          <!-- MAIN -->
          <section class="card gr-card">
            <div class="gr-card-top">
              <div>
                <div class="gr-card-title">Class Grades</div>
                <div class="gr-card-sub" id="grScopeLabel">—</div>
              </div>

              <div class="gr-card-controls">
                <div class="gr-pill">
                  <span class="gr-pill-label">Quarter</span>
                  <select id="quarterSelect" class="gr-select">
                    <option value="Q1">Quarter 1</option>
                    <option value="Q2">Quarter 2</option>
                    <option value="Q3">Quarter 3</option>
                    <option value="Q4">Quarter 4</option>
                  </select>
                </div>

                <div class="gr-pill">
                  <span class="gr-pill-label">Subject</span>
                  <select id="subjectSelect" class="gr-select"></select>
                </div>

                <button id="addWWBtn" class="gr-mini" type="button">＋ Add Written</button>
                <button id="addPTBtn" class="gr-mini" type="button">＋ Add Performance</button>
              </div>
            </div>

            <div class="gr-table-wrap">
              <table class="gr-table" id="gradesTable">
                <thead id="gradesThead"></thead>
                <tbody id="gradesTbody">
                  <tr>
                    <td colspan="99" class="gr-empty">Loading students…</td>
                  </tr>
                </tbody>
              </table>
            </div>

            <div class="gr-note">
              <div class="gr-note-title">Weights</div>
              <div class="gr-note-grid">
                <div><b>Performance / Recitation</b> <span>50%</span></div>
                <div><b>Written Works</b> <span>30%</span></div>
                <div><b>Exam</b> <span>20%</span></div>
              </div>
            </div>
          </section>

          <!-- SIDE -->
          <aside class="card gr-side">
            <div class="gr-side-title">Grades Summary</div>

            <div class="gr-metrics">
              <div class="gr-metric">
                <span>Total Students</span>
                <b id="mTotal">0</b>
              </div>
              <div class="gr-metric">
                <span>Class Average</span>
                <b id="mAvg">—</b>
              </div>
              <div class="gr-metric">
                <span>Highest Final</span>
                <b id="mHigh">—</b>
              </div>
              <div class="gr-metric">
                <span>Lowest Final</span>
                <b id="mLow">—</b>
              </div>
            </div>

            <div class="gr-side-actions">
              <button id="saveAllBtn" class="gr-btn gr-btn-primary" type="button">
                💾 Save All Grades
              </button>
              <button id="clearBtn" class="gr-btn gr-btn-ghost" type="button">
                🧹 Clear Current Subject & Quarter
              </button>
            </div>

            <div class="gr-status" id="saveStatus">Not Saved</div>
          </aside>
        </div>
      </section>
    </main>
  </div>
   <script src="../../js/auth/teacher-guard.js"></script>
  <script src="../../js/teacher/teacher-sidebar.js"></script>
  <script src="../../js/teacher/teacher-grades.js"></script>
</body>
</html>
