<!-- frontend/src/pages/teacher/teacher-announcements.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Teacher - Announcements</title>

  <!-- ✅ Prevent sidebar flash (teacher key) -->
  <script>
    (function () {
      try {
        const collapsed =
          localStorage.getItem("teacher_sidebar_collapsed_v1") === "1";
        if (collapsed) document.documentElement.classList.add("sb-collapsed");
      } catch {}
    })();
  </script>

  <!-- Font (same family used across your pages) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="../../styles/admin/sidebar.css" />
  <link rel="stylesheet" href="../../styles/admin/admin-dashboard.css" />

  <!-- Page -->
  <link rel="stylesheet" href="../../styles/teacher/teacher-announcements.css" />
</head>

<body data-page="teacher-announcements">
  <!-- floating collapse button -->
  <button
    class="sidebar-float-toggle"
    id="sidebarFloatToggle"
    type="button"
    aria-label="Toggle sidebar"
  >
    ←
  </button>

  <div class="app">
    <div id="sidebar-mount"></div>

    <main class="content">
      <!-- TOPBAR (keep consistent with other teacher pages) -->
      <header class="topbar">
        <div class="topbar-right">
          <button class="tb-icon" type="button" title="Notifications">🔔</button>

          <div class="tb-user" id="userbox">
            <img class="tb-avatar" src="../../assets/images/bg.jpg" alt="avatar" />
            <div class="tb-meta">
              <div class="tb-name">Teacher</div>
              <div class="tb-role">Advisory Class</div>
            </div>

            <button class="tb-drop" id="userMenuBtn" type="button">▾</button>

            <div class="tb-menu" id="userMenu">
              <button class="tb-item" type="button">Settings</button>
              <button class="tb-item danger" type="button" id="topbarLogout">Logout</button>
            </div>
          </div>
        </div>
      </header>

      <!-- PAGE -->
      <section class="ta-page ms-page">
        <div class="ta-title ms-title">Announcements</div>

        <!-- tabs -->
        <div class="ta-tabs" role="tablist" aria-label="Announcements tabs">
          <button class="ta-tab active" id="tabMy" type="button" role="tab" aria-selected="true">
            My Class
          </button>
          <button class="ta-tab" id="tabAdmin" type="button" role="tab" aria-selected="false">
            Admin Announcements
          </button>
        </div>

        <!-- LIST CARD -->
        <section class="card ta-card">
          <div class="ta-card-head">
            <div>
              <div class="ta-subtitle" id="listTitle">My Class Announcements</div>
              <div class="ta-subtext" id="listSubtext">Create and manage announcements for your class.</div>
            </div>

            <div class="ta-head-actions">
              <button class="ta-add-btn" id="btnNew" type="button">
                <span class="ta-plus">＋</span>
                New Announcement
              </button>
            </div>
          </div>

          <!-- tools -->
          <div class="ta-tools">
            <div class="ta-search">
              <span class="ta-search-ico">🔍</span>
              <input id="searchInput" type="text" placeholder="Search title or message..." />
            </div>

            <select id="statusFilter" class="ta-filter" aria-label="Status filter">
              <option value="all">All</option>
              <option value="published">Published</option>
              <option value="scheduled">Scheduled</option>
              <option value="draft">Draft</option>
            </select>

            <select id="scopeFilter" class="ta-filter" aria-label="Scope filter">
              <option value="all">All</option>
              <option value="myclass">My Class</option>
              <option value="admin">Admin</option>
            </select>
          </div>

          <!-- table -->
          <div class="ta-table-wrap">
            <table class="ta-table" aria-label="Announcements table">
              <thead>
                <tr>
                  <th>Title</th>
                  <th style="width:140px">Audience</th>
                  <th style="width:120px">Status</th>
                  <th style="width:160px">Date</th>
                  <th class="ta-action-head" style="width:140px">Action</th>
                </tr>
              </thead>
              <tbody id="listTbody">
                <tr class="ta-empty">
                  <td colspan="5">No announcements yet.</td>
                </tr>
              </tbody>
            </table>
          </div>
        </section>

        <!-- MODAL (Create/Edit/View) -->
        <div class="ta-modal hidden" id="announceModal" aria-hidden="true">
          <div class="ta-backdrop" id="modalBackdrop"></div>

          <div class="ta-dialog" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
            <div class="ta-dialog-head">
              <div class="ta-dialog-head-left">
                <div class="ta-dialog-title" id="modalTitle">New Announcement</div>
                <div class="ta-dialog-sub" id="modalSub">Compose a message for your class.</div>
              </div>

              <button class="ta-x" id="btnClose" type="button" aria-label="Close">✕</button>
            </div>

            <div class="ta-dialog-body">
              <div class="ta-field">
                <label for="inpTitle">Title <span class="req">*</span></label>
                <input id="inpTitle" type="text" placeholder="e.g., Reminder: Bring your notebooks" />
              </div>

              <div class="ta-row2">
                <div class="ta-field">
                  <label for="inpAudience">Audience</label>
                  <select id="inpAudience">
                    <option value="myclass">My Class</option>
                    <option value="all">All (Unassigned)</option>
                  </select>
                </div>

                <div class="ta-field">
                  <label for="inpStatus">Status</label>
                  <select id="inpStatus">
                    <option value="published">Publish now</option>
                    <option value="scheduled">Schedule</option>
                    <option value="draft">Draft</option>
                  </select>
                </div>
              </div>

              <div class="ta-field">
                <label for="inpMessage">Message <span class="req">*</span></label>
                <textarea id="inpMessage" rows="6" placeholder="Write the announcement..."></textarea>
                <div class="ta-hint" id="formHint"></div>
              </div>

              <div class="ta-row2">
                <div class="ta-field" id="scheduleWrap">
                  <label for="inpSchedule">Publish date (optional)</label>
                  <input id="inpSchedule" type="date" />
                </div>

                <div class="ta-field">
                  <label>Attachments (images)</label>
                  <input id="inpFiles" type="file" accept="image/*" multiple />
                </div>
              </div>

              <div class="ta-previews" id="imgPreviews"></div>
            </div>

            <div class="ta-dialog-foot">
              <button class="ta-btn ghost" id="btnCancel" type="button">Cancel</button>
              <button class="ta-btn" id="btnDraft" type="button">Save as Draft</button>
              <button class="ta-btn primary" id="btnPublish" type="button">Publish</button>
            </div>
          </div>
        </div>

      </section>
    </main>
  </div>
  <script src="../../js/auth/teacher-guard.js"></script>
  <script src="../../js/teacher/teacher-sidebar.js"></script>
  <script src="../../js/teacher/teacher-announcements.js"></script>
</body>
</html>
