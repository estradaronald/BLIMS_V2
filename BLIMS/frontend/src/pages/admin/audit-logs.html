<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin - Audit Logs</title>

  <!-- Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">

  <!-- Shared styles -->
  <link rel="stylesheet" href="../../styles/admin/sidebar.css" />
  <link rel="stylesheet" href="../../styles/admin/admin-dashboard.css" />

  <!-- Page styles -->
  <link rel="stylesheet" href="../../styles/admin/admin-audit-logs.css" />

  <!-- ✅ Page-header spacing rule -->
  <style>
    .topbar { margin-bottom: 4px; }
    .ms-page { padding: 0; }
  </style>
</head>

<body data-page="audit-logs">
  <!-- Sidebar Floating Toggle -->
  <button class="sidebar-float-toggle" id="sidebarFloatToggle" type="button" aria-label="Toggle sidebar">
    ←
  </button>

  <div class="app">
    <div id="sidebar-mount"></div>

    <main class="content ms-page">
      <!-- Topbar (copied UI) -->
      <header class="topbar">
        <div class="topbar-right">
          <button class="tb-icon" type="button" title="Notifications">🔔</button>

          <div class="tb-user" id="userbox">
            <img class="tb-avatar" src="../../assets/images/bg.jpg" alt="avatar">
            <div class="tb-meta">
              <div class="tb-name" id="tbName">Admin</div>
              <div class="tb-role">School Admin</div>
            </div>
            <button class="tb-drop" id="userMenuBtn" type="button">▾</button>

            <div class="tb-menu" id="userMenu">
              <button class="tb-item" type="button">Settings</button>
              <button class="tb-item danger" type="button" id="topbarLogout">Logout</button>
            </div>
          </div>
        </div>
      </header>

      <!-- Page body -->
      <section class="audit-wrap">
        <div class="card audit-card">
          <div class="audit-head">
            <div class="audit-title">
              <span class="mini-ico">🧾</span>
              <span>Audit Logs</span>
            </div>

            <div class="audit-controls">
              <input id="qInput" class="audit-input" type="search" placeholder="Search username, action, message, IP..." />
              <select id="actionSelect" class="audit-select">
                <option value="">All Actions</option>
                <option value="AUTH_LOGIN_SUCCESS">AUTH_LOGIN_SUCCESS</option>
                <option value="AUTH_LOGIN_FAIL">AUTH_LOGIN_FAIL</option>
                <option value="AUTH_LOGOUT">AUTH_LOGOUT</option>
                <option value="AUTH_PASSWORD_CHANGED">AUTH_PASSWORD_CHANGED</option>
              </select>
              <select id="outcomeSelect" class="audit-select">
                <option value="">All Outcomes</option>
                <option value="SUCCESS">SUCCESS</option>
                <option value="FAIL">FAIL</option>
                <option value="INFO">INFO</option>
              </select>

              <button id="applyBtn" class="audit-btn" type="button">Apply</button>
              <button id="clearBtn" class="audit-btn ghost" type="button">Clear</button>
            </div>
          </div>

          <div class="table-wrap audit-table-wrap">
            <table class="table">
              <thead>
                <tr>
                  <th style="width: 170px;">DATE</th>
                  <th style="width: 140px;">USER</th>
                  <th style="width: 120px;">ROLE</th>
                  <th style="width: 220px;">ACTION</th>
                  <th style="width: 110px;">OUTCOME</th>
                  <th>MESSAGE</th>
                  <th style="width: 150px;">IP</th>
                </tr>
              </thead>
              <tbody id="auditBody"></tbody>
            </table>
          </div>

          <div class="audit-foot">
            <div class="audit-meta" id="auditMeta">Loading…</div>
            <div class="audit-pager">
              <button id="prevBtn" class="audit-btn ghost" type="button">Prev</button>
              <div class="audit-page" id="pageLabel">Page 1</div>
              <button id="nextBtn" class="audit-btn ghost" type="button">Next</button>
            </div>
          </div>
        </div>
      </section>
    </main>
  </div>

  <script src="../../js/auth/admin-guard.js"></script>
  <script src="../../js/admin/sidebar.js"></script>
  <script src="../../js/admin/admin-audit-logs.js"></script>
</body>
</html>
