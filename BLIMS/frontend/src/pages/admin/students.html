<!-- frontend/src/pages/admin/students.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin - Students</title>

  <!-- Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">

  <!-- ✅ Prevent sidebar flash (teacher pattern) -->
  <script>
    (function () {
      try {
        const collapsed = localStorage.getItem("admin_sidebar_collapsed_v1") === "1";
        if (collapsed) document.documentElement.classList.add("sb-collapsed");
      } catch {}
    })();
  </script>

  <!-- SAME as dashboard/teachers -->
  <link rel="stylesheet" href="../../styles/admin/sidebar.css" />
  <link rel="stylesheet" href="../../styles/admin/admin-dashboard.css" />
  <link rel="stylesheet" href="../../styles/admin/admin-students.css" />
</head>

<body data-page="students">
  <!-- floating toggle -->
  <button
    class="sidebar-float-toggle"
    id="sidebarFloatToggle"
    type="button"
    aria-label="Toggle sidebar"
  >
    ←
  </button>

  <div class="app">
    <div id="sidebar-mount"></div>

    <main class="content">
      <!-- TOP BAR -->
      <header class="topbar">
        <div class="topbar-right">
          <button class="tb-icon" type="button" title="Notifications">🔔</button>

          <div class="tb-user" id="userbox">
            <img
              class="tb-avatar"
              src="../../assets/images/bg.jpg"
              alt="avatar"
            />
            <div class="tb-meta">
              <div class="tb-name">admin@school.com</div>
              <div class="tb-role"> admin</div>
            </div>
            <button class="tb-drop" id="userMenuBtn" type="button">▾</button>

            <div class="tb-menu" id="userMenu">
              <button class="tb-item" type="button">Settings</button>
              <button class="tb-item danger" type="button" id="topbarLogout">
                Logout
              </button>
            </div>
          </div>
        </div>
      </header>

      <!-- PAGE -->
      <section class="teachers-wrap">
        <div class="teachers-page-head">
          <h2 class="teachers-title">Students</h2>

          <button id="addNewBtn" class="t-add-btn" type="button">
            Add New <span class="t-plus">＋</span>
          </button>
        </div>

        <!-- =====================
             LIST VIEW
        ====================== -->
        <section id="listView" class="t-view">
          <div class="card t-card">
            <div class="t-card-head">
              <div class="t-subtitle">All Students List</div>

              <div class="t-tools">
                <div class="t-search">
                  <span class="t-search-ico">🔎</span>
                  <input
                    id="searchInput"
                    type="text"
                    placeholder="Search by Name, ID, or LRN"
                  />
                </div>

                <select id="classFilter" class="t-filter">
                  <option value="all">All Classes</option>
                </select>
              </div>
            </div>

            <div class="t-table-wrap">
              <table class="t-table">
                <thead>
                  <tr>
                    <th style="width:70px">No.</th>
                    <th>Full Name</th>
                    <th>LRN</th>
                    <th>Email</th>
                    <th>Password</th>
                    <th>Class &amp; Section</th>
                    <th>Contact No.</th>
                    <th class="t-action-head" style="width:150px">Action</th>
                  </tr>
                </thead>
                <tbody id="studentsTbody">
                  <tr class="t-empty">
                    <td colspan="8">No students yet.</td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>
        </section>

        <!-- =====================
             ADD / EDIT FORM
        ====================== -->
        <section id="formView" class="t-view hidden">
          <div class="t-form-grid">

            <!-- LEFT COLUMN -->
            <div class="t-form-left t-left-col">

              <!-- BASIC -->
              <div class="card t-form-card t-basic-card">
                <div class="t-form-hd">Basic Information</div>

                <div class="t-form-bd">
                  <div class="t-basic-left">

                    <div class="t-row2">
                      <div class="t-field">
                        <label>First Name</label>
                        <input id="firstName" type="text" />
                      </div>
                      <div class="t-field">
                        <label>Last Name</label>
                        <input id="lastName" type="text" />
                      </div>
                    </div>

                    <div class="t-row2">
                      <div class="t-field">
                        <label>Middle Name</label>
                        <input id="middleName" type="text" />
                      </div>
                      <div class="t-field">
                        <label>Date of Birth</label>
                        <input id="dob" type="date" />
                      </div>
                    </div>

                    <div class="t-row2">
                      <div class="t-field">
                        <label>LRN</label>
                        <input id="lrn" type="text" placeholder="Learner Reference Number" />
                      </div>
                      <div class="t-field">
                        <label>Gender</label>
                        <div class="t-gender">
                          <label class="t-radio">
                            <input type="radio" name="gender" value="male" checked />
                            <span>Male</span>
                          </label>
                          <label class="t-radio">
                            <input type="radio" name="gender" value="female" />
                            <span>Female</span>
                          </label>
                        </div>
                      </div>
                    </div>

                    <div class="t-row2">
                      <div class="t-field">
                        <label>Class</label>
                        <div class="t-inline">
                          <select id="classSelect" class="t-select"></select>
                          <button id="addClassBtn" class="t-mini" type="button">＋</button>
                        </div>
                      </div>

                      <div class="t-field">
                        <label>Section</label>
                        <div class="t-inline">
                          <select id="sectionSelect" class="t-select"></select>
                          <button id="addSectionBtn" class="t-mini" type="button">＋</button>
                        </div>
                      </div>
                    </div>
                  </div>

                  <!-- PHOTO (same system as teachers) -->
                  <div class="t-basic-right">
                    <div class="t-upload">
                      <input id="photoInput" type="file" accept="image/*" hidden />
                      <div class="t-upload-box" id="photoPreview">
                        <div class="t-upload-ico">📄</div>
                        <div class="t-upload-text">Drop your files to upload</div>
                        <button id="selectFilesBtn" class="t-ghost small" type="button">
                          Select files
                        </button>
                      </div>
                      <button id="removePhotoBtn" class="t-remove hidden" type="button">✕</button>
                    </div>
                  </div>

                </div>
              </div>

              <!-- PARENT DETAILS -->
              <div class="card t-form-card t-creds-card">
                <div class="t-form-hd">Parent Details</div>

                <div class="t-form-bd">
                  <div class="pd-grid">
                    <!-- LEFT: Father -->
                    <div class="pd-col">
                      <div class="t-field">
                        <label>Father Name</label>
                        <input id="fatherName" type="text" />
                      </div>

                      <div class="t-field">
                        <label>Father Occupation</label>
                        <input id="fatherOccupation" type="text" />
                      </div>

                      <div class="t-field">
                        <label>Father Contact</label>
                        <div class="phone-input">
                          <span class="phone-prefix">+63</span>
                          <input id="fatherContact" type="text" placeholder="9123456789" />
                        </div>
                      </div>
                    </div>

                    <!-- RIGHT: Mother -->
                    <div class="pd-col">
                      <div class="t-field">
                        <label>Mother Name</label>
                        <input id="motherName" type="text" />
                      </div>

                      <div class="t-field">
                        <label>Mother Occupation</label>
                        <input id="motherOccupation" type="text" />
                      </div>

                      <div class="t-field">
                        <label>Mother Contact</label>
                        <div class="phone-input">
                          <span class="phone-prefix">+63</span>
                          <input id="motherContact" type="text" placeholder="9123456789" />
                        </div>
                      </div>
                    </div>
                  </div>
                </div>
              </div>

            </div>
            <!-- /LEFT COLUMN -->

            <!-- RIGHT COLUMN -->
            <div class="t-form-right t-right-col">

              <!-- ACCOUNT -->
              <div class="card t-form-card">
                <div class="t-form-hd">Login / Account Details</div>
                <div class="t-form-bd">
                  <div class="t-row2">
                    <div class="t-field">
                      <label>Student ID</label>
                      <input id="studentId" readonly />
                    </div>
                    <div class="t-field">
                      <label>Password</label>
                      <div class="t-inline">
                        <input id="tempPass" readonly />
                        <button id="regenPassBtn" class="t-mini" type="button">↻</button>
                      </div>
                    </div>
                  </div>
                </div>
              </div>

              <!-- CONTACT -->
              <div class="card t-form-card">
                <div class="t-form-hd">Contact & Address</div>
                <div class="t-form-bd">
                  <div class="t-row2">
                    <div class="t-field">
                      <label>Phone</label>
                      <div class="phone-input">
                        <span class="phone-prefix">+63</span>
                        <input id="phone" type="text" placeholder="9123456789" />
                      </div>
                    </div>

                    <div class="t-field">
                      <label>Email</label>
                      <input id="email" />
                    </div>
                  </div>

                  <div class="t-field">
                    <label>Street</label>
                    <input id="street" />
                  </div>

                  <div class="t-row2">
                    <div class="t-field">
                      <label>Province</label>
                      <select id="provinceSelect" class="t-select"></select>
                    </div>
                    <div class="t-field">
                      <label>City</label>
                      <select id="citySelect" class="t-select" disabled></select>
                    </div>
                  </div>

                  <div class="t-row2">
                    <div class="t-field">
                      <label>Barangay</label>
                      <select id="brgySelect" class="t-select" disabled></select>
                    </div>
                    <div class="t-field">
                      <label>Postal Code</label>
                      <input id="postal" />
                    </div>
                  </div>
                </div>
              </div>

              <div id="formError" class="t-error hidden"></div>

              <!-- BUTTONS -->
              <div class="t-form-actions t-form-actions-bottom">
                <button id="cancelBtn" class="t-ghost" type="button">Cancel</button>
                <button id="resetBtn" class="t-ghost" type="button">Reset</button>
                <button id="saveBtn" class="t-save" type="button">Save</button>
              </div>

            </div>
            <!-- /RIGHT COLUMN -->

          </div>
        </section>

      </section>
    </main>
  </div>

  <!-- =====================
     STUDENT PROFILE MODAL
  ===================== -->
  <div id="studentModal" class="tmodal hidden" aria-hidden="true">
    <div class="tmodal-backdrop" id="studentModalBackdrop"></div>

    <div class="tmodal-dialog" tabindex="-1" role="dialog" aria-modal="true" aria-labelledby="studentModalTitle">
      <!-- header -->
      <div class="tmodal-head">
        <div class="tmodal-head-left">
          <img id="smAvatar" class="tmodal-avatar" src="../../assets/images/bg.jpg" alt="student avatar" />

          <div>
            <div id="studentModalTitle" class="tmodal-title">Student Profile</div>
            <div class="tmodal-sub">
              <span id="smStudentId">Student ID: —</span>
              <span class="tmodal-dot">•</span>
              <span class="tmodal-status">
                <span class="tmodal-status-dot"></span>
                Active
              </span>
            </div>
          </div>
        </div>

        <button class="tmodal-x" id="studentModalCloseX" type="button">✕</button>
      </div>

      <!-- tabs -->
      <div class="tmodal-tabs">
        <button class="tmodal-tab active" data-tab="basic" type="button">Basic Info</button>
        <button class="tmodal-tab" data-tab="address" type="button">Contact & Address</button>
        <button class="tmodal-tab" data-tab="parents" type="button">Parent Details</button>
        <button class="tmodal-tab" data-tab="account" type="button">Account</button>
      </div>

      <!-- body -->
      <div class="tmodal-body">
        <!-- BASIC -->
        <div class="tmodal-panel" data-panel="basic">
          <div class="tmodal-grid">
            <div class="tmodal-field">
              <label>Full Name</label>
              <input id="smFullName" readonly>
            </div>

            <div class="tmodal-field">
              <label>LRN</label>
              <input id="smLRN" readonly>
            </div>

            <div class="tmodal-field">
              <label>Gender</label>
              <input id="smGender" readonly>
            </div>

            <div class="tmodal-field">
              <label>Date of Birth</label>
              <input id="smDob" readonly>
            </div>

            <div class="tmodal-field">
              <label>Class & Section</label>
              <input id="smClassSection" readonly>
            </div>
          </div>
        </div>

        <!-- ADDRESS -->
        <div class="tmodal-panel hidden" data-panel="address">
          <div class="tmodal-grid">
            <div class="tmodal-field">
              <label>Phone</label>
              <input id="smPhone" readonly>
            </div>

            <div class="tmodal-field">
              <label>Email</label>
              <input id="smEmail" readonly>
            </div>

            <div class="tmodal-field">
              <label>Street</label>
              <input id="smStreet" readonly>
            </div>

            <div class="tmodal-field">
              <label>Province</label>
              <input id="smProvince" readonly>
            </div>

            <div class="tmodal-field">
              <label>City</label>
              <input id="smCity" readonly>
            </div>

            <div class="tmodal-field">
              <label>Barangay</label>
              <input id="smBrgy" readonly>
            </div>

            <div class="tmodal-field">
              <label>Postal Code</label>
              <input id="smPostal" readonly>
            </div>
          </div>
        </div>

        <!-- PARENTS -->
        <div class="tmodal-panel hidden" data-panel="parents">
          <div class="pd-grid pd-modal">
            <!-- LEFT: Father -->
            <div class="pd-col">
              <div class="tmodal-field">
                <label>Father Name</label>
                <input id="smFatherName" readonly>
              </div>

              <div class="tmodal-field">
                <label>Father Occupation</label>
                <input id="smFatherOccupation" readonly>
              </div>

              <div class="tmodal-field">
                <label>Father Contact</label>
                <input id="smFatherContact" readonly>
              </div>
            </div>

            <!-- RIGHT: Mother -->
            <div class="pd-col">
              <div class="tmodal-field">
                <label>Mother Name</label>
                <input id="smMotherName" readonly>
              </div>

              <div class="tmodal-field">
                <label>Mother Occupation</label>
                <input id="smMotherOccupation" readonly>
              </div>

              <div class="tmodal-field">
                <label>Mother Contact</label>
                <input id="smMotherContact" readonly>
              </div>
            </div>
          </div>
        </div>

        <!-- ACCOUNT -->
        <div class="tmodal-panel hidden" data-panel="account">
          <div class="tmodal-grid">
            <div class="tmodal-field">
              <label>Student ID</label>
              <input id="smAccId" readonly>
            </div>

            <div class="tmodal-field">
              <label>Temp Password</label>
              <input id="smAccPass" readonly>
            </div>
          </div>
        </div>
      </div>

      <!-- footer -->
      <div class="tmodal-foot">
        <button class="t-ghost" id="studentModalCloseBtn" type="button">Close</button>
        <div class="tmodal-foot-right">
          <button class="t-save" id="studentModalEditBtn" type="button">Edit Student</button>
          <button class="tmodal-danger" id="studentModalDisableBtn" type="button">Disable Account</button>
        </div>
      </div>
    </div>
  </div>

  <script src="../../js/auth/admin-guard.js"></script>
  <script src="../../js/admin/sidebar.js"></script>
  <script src="../../js/admin/admin-dashboard.js"></script>
  <script src="../../js/admin/admin-students.js"></script>
</body>
</html>
