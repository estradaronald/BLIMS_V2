<!-- frontend/src/pages/admin/academic-records.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin - Academic Records</title>

  <!-- Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap"
    rel="stylesheet"
  />

  <!-- Shared -->
  <link rel="stylesheet" href="../../styles/admin/sidebar.css" />
  <link rel="stylesheet" href="../../styles/admin/admin-dashboard.css" />

  <!-- Page -->
  <link rel="stylesheet" href="../../styles/admin/admin-academic-records.css" />
</head>

<body data-page="academic-records">

  <button
    class="sidebar-float-toggle"
    id="sidebarFloatToggle"
    type="button"
    aria-label="Toggle sidebar"
  >
    ←
  </button>

  <div class="app">

    <div id="sidebar-mount"></div>

    <main class="content">

      <!-- TOPBAR -->
      <header class="topbar">

        <div class="topbar-right">

          <button
            class="tb-icon"
            type="button"
            title="Notifications"
          >
            🔔
          </button>

          <div class="tb-user" id="userbox">

            <img
              class="tb-avatar"
              src="../../assets/images/bg.jpg"
              alt="avatar"
            />

            <div class="tb-meta">
              <div class="tb-name">Estrada, Ronald B.</div>
              <div class="tb-role">Admin</div>
            </div>

            <button
              class="tb-drop"
              id="userMenuBtn"
              type="button"
            >
              ▾
            </button>

            <div class="tb-menu" id="userMenu">

              <button
                class="tb-item"
                type="button"
              >
                Settings
              </button>

              <button
                class="tb-item danger"
                type="button"
                id="topbarLogout"
              >
                Logout
              </button>

            </div>

          </div>

        </div>

      </header>


      <!-- PAGE -->
      <section class="ar-wrap">

        <!-- PAGE HEADER -->
        <div class="ar-head">

          <div>

            <h2 class="ar-title">
              Academic Records
            </h2>

            <div class="ar-sub">
              View and export student academic records.
            </div>

          </div>


          <div class="ar-head-actions">

            <!-- EXPORT -->
            <div class="ar-export">

              <button
                class="ar-primary"
                id="exportBtn"
                type="button"
              >
                Export
                <span class="ar-plus">▾</span>
              </button>


              <!-- EXPORT MENU -->
              <div
                class="ar-menu hidden"
                id="exportMenu"
              >

                <!-- Current View -->
                <button
                  class="ar-menu-item"
                  id="exportClassBtn"
                  type="button"
                >
                  Export Current View
                </button>


                <!-- Selected Grade Level -->
                <button
                  class="ar-menu-item"
                  id="exportGradeBtn"
                  type="button"
                >
                  Export Grade Level
                </button>


                <!-- All Records -->
                <button
                  class="ar-menu-item"
                  id="exportAllBtn"
                  type="button"
                >
                  Export All Records
                </button>

              </div>

            </div>

          </div>

        </div>


        <!-- ACADEMIC RECORDS CARD -->
        <section class="card ar-card">

          <!-- FILTERS -->
          <div class="ar-tools">

            <!-- GRADE LEVEL -->
            <div class="ar-field">

              <label>
                Grade Level
              </label>

              <select
                id="gradeSelect"
                class="ar-input"
              ></select>

            </div>


            <!-- SECTION -->
            <div class="ar-field">

              <label>
                Section
              </label>

              <select
                id="sectionSelect"
                class="ar-input"
              ></select>

            </div>


            <!-- SEARCH -->
            <div class="ar-search">

              <span class="ar-search-ico">
                🔎
              </span>

              <input
                id="searchInput"
                type="text"
                placeholder="Search student name..."
              />

            </div>


            <!-- SUMMARY -->
            <div
              class="ar-summary"
              id="summaryLine"
            >
              —
            </div>

          </div>


          <!-- TABLE -->
          <div class="ar-table-wrap">

            <table class="ar-table">

              <thead>

                <tr>

                  <th style="width:70px;">
                    No.
                  </th>

                  <th>
                    Student
                  </th>

                  <!--
                    Term columns are dynamically generated
                    by admin-academic-records.js
                  -->

                  <th style="width:90px; text-align:center;">
                    Q1
                  </th>

                  <th style="width:90px; text-align:center;">
                    Q2
                  </th>

                  <th style="width:90px; text-align:center;">
                    Q3
                  </th>

                  <th style="width:90px; text-align:center;">
                    Q4
                  </th>

                  <th style="width:130px; text-align:center;">
                    Final Avg
                  </th>

                  <th style="width:140px; text-align:center;">
                    Status
                  </th>

                </tr>

              </thead>


              <tbody id="recordsTbody">

                <tr class="ar-empty">

                  <td colspan="8">
                    No records found.
                  </td>

                </tr>

              </tbody>

            </table>

          </div>

        </section>

      </section>

    </main>

  </div>


  <!-- SCRIPTS -->

  <script src="../../js/auth/admin-guard.js"></script>

  <script src="../../js/admin/sidebar.js"></script>

  <script src="../../js/admin/admin-dashboard.js"></script>

  <script src="../../js/admin/admin-academic-records.js"></script>

</body>
</html>
