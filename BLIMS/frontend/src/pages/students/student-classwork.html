<!-- frontend/src/pages/student/student-classwork.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Student - Classwork</title>

  <!-- Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">

  <!-- ✅ same baseline styles -->
  <link rel="stylesheet" href="../../styles/admin/sidebar.css" />
  <link rel="stylesheet" href="../../styles/admin/admin-dashboard.css" />

  <!-- keep same header/card/modal feel -->
  <link rel="stylesheet" href="../../styles/admin-announcements.css" />

  <!-- Student Classwork styles -->
  <link rel="stylesheet" href="../../styles/student/student-classwork.css" />
</head>

<body data-page="classwork">
  <!-- floating toggle -->
  <button class="sidebar-float-toggle" id="sidebarFloatToggle" type="button" aria-label="Toggle sidebar">
    ←
  </button>

  <div class="app">
    <div id="sidebar-mount"></div>

    <main class="content">
      <!-- TOP BAR -->
      <header class="topbar">
        <div class="topbar-right">
          <button class="tb-icon" type="button" title="Notifications">🔔</button>

          <div class="tb-user" id="userbox">
            <img class="tb-avatar" src="../../assets/images/bg.jpg" alt="avatar" />
            <div class="tb-meta">
              <div class="tb-name">Student</div>
              <div class="tb-role">Classwork</div>
            </div>
            <button class="tb-drop" id="userMenuBtn" type="button">▾</button>

            <div class="tb-menu" id="userMenu">
              <button class="tb-item" type="button">Settings</button>
              <button class="tb-item danger" type="button" id="topbarLogout">Logout</button>
            </div>
          </div>
        </div>
      </header>

      <!-- ✅ PAGE HEADER RULE -->
      <section class="teachers-wrap">
        <div class="teachers-page-head">
          <h2 class="teachers-title">Classwork</h2>
        </div>

        <!-- MAIN CARD -->
        <div class="card t-card cw-card">
          <div class="t-card-head cw-head">
            <div class="cw-left">
              <div class="t-subtitle">Assignments & Tasks</div>
              <div class="cw-sub">
                <span id="cwGradeSection">Grade 6 - Section A</span>
                <span class="cw-dot">•</span>
                <span id="cwSYLabel">SY —</span>
              </div>
            </div>

            <div class="cw-actions">
              <!-- Status filter -->
              <select id="cwStatusFilter" class="t-filter" aria-label="Filter by status">
                <option value="all">Status: All</option>
                <option value="pending">Pending</option>
                <option value="submitted">Submitted</option>
              </select>

              <!-- Subject filter -->
              <select id="cwSubjectFilter" class="t-filter" aria-label="Filter by subject">
                <option value="all">Subject: All</option>
              </select>

              <!-- Search -->
              <div class="t-search cw-search">
                <span class="t-search-ico">🔎</span>
                <input id="cwSearch" type="text" placeholder="Search classwork" />
              </div>
            </div>
          </div>

          <div class="cw-body">
            <!-- LIST -->
            <div class="cw-list" id="cwList"></div>

            <!-- EMPTY -->
            <div id="cwEmpty" class="cw-empty hidden">
              No classwork to display.
            </div>
          </div>
        </div>
      </section>
    </main>
  </div>

  <!-- ✅ VIEW DETAILS MODAL (admin modal look) -->
  <div class="tmodal hidden" id="cwViewModal" aria-hidden="true" role="dialog" aria-modal="true">
    <div class="tmodal-backdrop" id="cwViewBackdrop"></div>

    <div class="tmodal-dialog cw-view-dialog" role="document">
      <div class="tmodal-head">
        <div>
          <div class="tmodal-title" id="cwViewTitle">Classwork Details</div>
          <div class="tmodal-sub" id="cwViewSub">—</div>
        </div>

        <button class="tmodal-x" id="cwViewCloseX" type="button" aria-label="Close">✕</button>
      </div>

      <div class="tmodal-body">
        <div class="cw-view-chips" id="cwViewChips"></div>

        <div class="cw-view-block">
          <div class="cw-view-label">Description</div>
          <div class="cw-view-text" id="cwViewDesc">—</div>
        </div>

        <div class="cw-view-block">
          <div class="cw-view-label">Attachment</div>
          <div class="cw-view-file" id="cwViewFile">
            <span class="cw-file-muted">No file attached.</span>
          </div>
        </div>
      </div>

      <div class="tmodal-foot">
        <button class="t-ghost" id="cwViewCloseBtn" type="button">Close</button>

        <div class="tmodal-foot-right">
            <button class="t-ghost" id="cwDownloadBtn" type="button">Download</button>
            <button class="t-save" id="cwSubmitOpenBtn" type="button">Submit</button>
        </div>
        </div>
    </div>
  </div>

  <!-- ✅ SUBMIT MODAL -->
  <div class="tmodal hidden" id="cwSubmitModal" aria-hidden="true" role="dialog" aria-modal="true">
    <div class="tmodal-backdrop" id="cwSubmitBackdrop"></div>

    <div class="tmodal-dialog cw-submit-dialog" role="document">
      <div class="tmodal-head">
        <div>
          <div class="tmodal-title">Submit Assignment</div>
          <div class="tmodal-sub" id="cwSubmitSub">—</div>
        </div>

        <button class="tmodal-x" id="cwSubmitCloseX" type="button" aria-label="Close">✕</button>
      </div>

      <div class="tmodal-body">
        <div class="cw-upload">
          <div class="cw-view-label">Upload file</div>
          <input id="cwSubmitFile" type="file" />
          <div class="cw-help">
            (Frontend-only for now. Later this will upload to backend.)
          </div>
        </div>

        <div class="cw-upload">
          <div class="cw-view-label">Notes (optional)</div>
          <textarea id="cwSubmitNotes" rows="4" placeholder="Add a short note..."></textarea>
        </div>

        <div id="cwSubmitMsg" class="cw-msg hidden"></div>
      </div>

      <div class="tmodal-foot">
        <button class="t-ghost" id="cwSubmitCancelBtn" type="button">Cancel</button>

        <div class="tmodal-foot-right">
            <button class="t-save" id="cwSubmitBtn" type="button">Submit</button>
        </div>
</div>
    </div>
  </div>

  <script src="../../js/student/student-sidebar.js"></script>
  <script src="../../js/student/student-classwork.js"></script>
</body>
</html>
