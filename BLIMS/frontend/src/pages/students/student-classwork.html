<!-- frontend/src/pages/student/student-classwork.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Student - Classwork</title>

  <!-- Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap"
    rel="stylesheet"
  >

  <!-- Baseline styles -->
  <link
    rel="stylesheet"
    href="../../styles/admin/sidebar.css"
  />

  <link
    rel="stylesheet"
    href="../../styles/admin/admin-dashboard.css"
  />

  <!-- Header / Card / Modal styles -->
  <link
    rel="stylesheet"
    href="../../styles/admin-announcements.css"
  />

  <!-- Student Classwork styles -->
  <link
    rel="stylesheet"
    href="../../styles/student/student-classwork.css"
  />
</head>

<body data-page="classwork">

  <!-- =========================================
       FLOATING SIDEBAR TOGGLE
  ========================================== -->

  <button
    class="sidebar-float-toggle"
    id="sidebarFloatToggle"
    type="button"
    aria-label="Toggle sidebar"
  >
    ←
  </button>


  <div class="app">

    <!-- =========================================
         SIDEBAR
    ========================================== -->

    <div id="sidebar-mount"></div>


    <main class="content">

      <!-- =========================================
           TOP BAR
      ========================================== -->

      <header class="topbar">

        <div class="topbar-right">

         


          <div
            class="tb-user"
            id="userbox"
          >

            <img
              class="tb-avatar"
              src="../../assets/images/bg.jpg"
              alt="Student avatar"
            />


            <div class="tb-meta">

              <div class="tb-name">
                Student
              </div>

              <div class="tb-role">
                Classwork
              </div>

            </div>


            <button
              class="tb-drop"
              id="userMenuBtn"
              type="button"
              aria-label="Open user menu"
            >
              ▾
            </button>


            <div
              class="tb-menu"
              id="userMenu"
            >

              <button
                class="tb-item"
                type="button"
              >
                Settings
              </button>


              <button
                class="tb-item danger"
                id="topbarLogout"
                type="button"
              >
                Logout
              </button>

            </div>

          </div>

        </div>

      </header>


      <!-- =========================================
           PAGE
      ========================================== -->

      <section class="teachers-wrap">

        <!-- PAGE HEADER -->

        <div class="teachers-page-head">

          <h2 class="teachers-title">
            Classwork
          </h2>

        </div>


        <!-- =========================================
             MAIN CARD
        ========================================== -->

        <div class="card t-card cw-card">

          <!-- CARD HEADER -->

          <div class="t-card-head cw-head">

            <!-- LEFT -->

            <div class="cw-left">

              <div class="t-subtitle">
                Assignments & Tasks
              </div>


              <!--
                School year intentionally removed.
                Student only sees their class and section.
              -->

              <div class="cw-sub">

                <span id="cwGradeSection">
                  Grade 6 - Section A
                </span>

              </div>

            </div>


            <!-- =====================================
                 FILTERS / SEARCH
            ====================================== -->

            <div class="cw-actions">

              <!-- Subject filter -->

              <div class="cw-filter-wrap">

                <select
                  id="cwSubjectFilter"
                  class="t-filter cw-filter"
                  aria-label="Filter by subject"
                >
                  <option value="all">
                    Subject: All
                  </option>
                </select>

              </div>


              <!-- Search -->

              <div class="t-search cw-search">

                <span
                  class="t-search-ico"
                  aria-hidden="true"
                >
                  🔎
                </span>


                <input
                  id="cwSearch"
                  type="text"
                  placeholder="Search classwork"
                  aria-label="Search classwork"
                  autocomplete="off"
                />

              </div>

            </div>

          </div>


          <!-- =========================================
               CLASSWORK BODY
          ========================================== -->

          <div class="cw-body">

            <!-- Assignment list -->

            <div
              class="cw-list"
              id="cwList"
            ></div>


            <!-- Empty state -->

            <div
              id="cwEmpty"
              class="cw-empty hidden"
            >
              No classwork to display.
            </div>

          </div>

        </div>

      </section>

    </main>

  </div>


  <!-- =============================================
       VIEW ASSIGNMENT DETAILS MODAL
  ============================================== -->

  <div
    class="tmodal hidden"
    id="cwViewModal"
    aria-hidden="true"
    role="dialog"
    aria-modal="true"
    aria-labelledby="cwViewTitle"
  >

    <!-- Backdrop -->

    <div
      class="tmodal-backdrop"
      id="cwViewBackdrop"
    ></div>


    <!-- Dialog -->

    <div
      class="tmodal-dialog cw-view-dialog"
      role="document"
    >

      <!-- =========================================
           MODAL HEADER
      ========================================== -->

      <div class="tmodal-head">

        <div>

          <div
            class="tmodal-title"
            id="cwViewTitle"
          >
            Assignment Details
          </div>


          <div
            class="tmodal-sub"
            id="cwViewSub"
          >
            —
          </div>

        </div>


        <button
          class="tmodal-x"
          id="cwViewCloseX"
          type="button"
          aria-label="Close"
        >
          ✕
        </button>

      </div>


      <!-- =========================================
           MODAL BODY
      ========================================== -->

      <div class="tmodal-body">

        <!-- Assignment information -->

        <div
          class="cw-view-chips"
          id="cwViewChips"
        ></div>


        <!-- Instructions -->

        <div class="cw-view-block">

          <div class="cw-view-label">
            Description
          </div>


          <div
            class="cw-view-text"
            id="cwViewDesc"
          >
            —
          </div>

        </div>


        <!-- Attachment -->

        <div class="cw-view-block">

          <div class="cw-view-label">
            Attachment
          </div>


          <div
            class="cw-view-file"
            id="cwViewFile"
          >

            <span class="cw-file-muted">
              No file attached.
            </span>

          </div>

        </div>

      </div>


      <!-- =========================================
           MODAL FOOTER
      ========================================== -->

      <div class="tmodal-foot">

        <button
          class="t-ghost"
          id="cwViewCloseBtn"
          type="button"
        >
          Close
        </button>


        <div class="tmodal-foot-right">

          <button
            class="t-ghost"
            id="cwDownloadBtn"
            type="button"
            disabled
          >
            Download
          </button>

        </div>

      </div>

    </div>

  </div>


  <!-- =============================================
       SCRIPTS
  ============================================== -->

  <script
    src="../../js/student/student-sidebar.js"
  ></script>


  <script
    src="../../js/student/student-classwork.js"
  ></script>

</body>
</html>
