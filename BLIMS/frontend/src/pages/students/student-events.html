<!-- frontend/src/pages/student/student-events.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Student - Events</title>

  <!-- Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">

 <!-- ✅ same baseline styles -->
  <link rel="stylesheet" href="../../styles/admin/sidebar.css" />
  <link rel="stylesheet" href="../../styles/admin/admin-dashboard.css" />


  <!-- helps keep the same header/card/modal feel across pages -->
  <link rel="stylesheet" href="../../styles/admin-announcements.css" />

  <!-- Student Events styles -->
  <link rel="stylesheet" href="../../styles/student/student-events.css" />
</head>

<body data-page="events">
  <!-- floating toggle -->
  <button class="sidebar-float-toggle" id="sidebarFloatToggle" type="button" aria-label="Toggle sidebar">
    ←
  </button>

  <div class="app">
    <div id="sidebar-mount"></div>

    <main class="content">
      <!-- TOP BAR -->
      <header class="topbar">
        <div class="topbar-right">
          <div class="tb-user" id="userbox">
            <img class="tb-avatar" src="../../assets/images/bg.jpg" alt="avatar" />
            <div class="tb-meta">
              <div class="tb-name">Student</div>
              <div class="tb-role">Events</div>
            </div>
            <button class="tb-drop" id="userMenuBtn" type="button">▾</button>

            <div class="tb-menu" id="userMenu">
              <button class="tb-item" type="button">Settings</button>
              <button class="tb-item danger" type="button" id="topbarLogout">Logout</button>
            </div>
          </div>
        </div>
      </header>

      <!-- ✅ PAGE HEADER RULE -->
      <section class="teachers-wrap">
        <div class="teachers-page-head">
          <h2 class="teachers-title">Events</h2>
        </div>

        <!-- MAIN CARD -->
        <div class="card t-card ev-card">
          <div class="t-card-head ev-head">
            <div class="ev-left">
              <div class="t-subtitle">School Events</div>
              <div class="ev-sub">
                <span id="evSYLabel">SY —</span>
                <span class="ev-dot">•</span>
                <span class="evCount" id="evCount">0 events</span>
              </div>
            </div>

            <div class="ev-actions">
              <!-- SY selector (Admin-controlled; defaults to active SY) -->
              <select id="sySelect" class="t-filter" aria-label="Select school year">
                <option value="">SY —</option>
              </select>

              <!-- View filter -->
              <select id="viewFilter" class="t-filter" aria-label="Filter events">
                <option value="all">All events</option>
                <option value="upcoming">Upcoming</option>
                <option value="past">Past</option>
              </select>

              <!-- Type filter (optional) -->
              <select id="typeFilter" class="t-filter" aria-label="Filter by type">
                <option value="all">Type: All</option>
                <option value="holiday">Holiday</option>
                <option value="exam">Exam</option>
                <option value="activity">Activity</option>
                <option value="meeting">Meeting</option>
              </select>

              <!-- Search -->
              <div class="t-search ev-search">
                <span class="t-search-ico">🔎</span>
                <input id="evSearch" type="text" placeholder="Search events" />
              </div>
            </div>
          </div>

          <div class="ev-body">
            <div class="ev-list" id="evList"></div>

            <div id="evEmpty" class="ev-empty hidden">
              No events to display.
            </div>
          </div>
        </div>
      </section>
    </main>
  </div>

  <!-- ✅ View Details Modal (matches Admin modal style classes) -->
  <div class="tmodal hidden" id="evViewModal" aria-hidden="true" role="dialog" aria-modal="true">
    <div class="tmodal-backdrop" id="evViewBackdrop"></div>

    <div class="tmodal-dialog ev-view-dialog" role="document">
      <div class="tmodal-head">
        <div>
          <div class="tmodal-title" id="evViewTitle">Event Details</div>
          <div class="tmodal-sub" id="evViewSub">—</div>
        </div>

        <button class="tmodal-x" id="evViewCloseX" type="button" aria-label="Close">✕</button>
      </div>

      <div class="tmodal-body">
        <div class="ev-view-top" id="evViewTop"></div>
        <div class="ev-view-notes" id="evViewNotes"></div>
      </div>

      <div class="tmodal-foot">
        <button class="tbtn" id="evViewCloseBtn" type="button">Close</button>
      </div>
    </div>
  </div>

  <script src="../../js/student/student-sidebar.js"></script>
  <script src="../../js/student/student-events.js"></script>
</body>
</html>
