<!-- frontend/src/pages/student/student-attendance.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Student - Attendance</title>

  <!-- Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap"
    rel="stylesheet"
  >

  <!-- Baseline styles -->
  <link
    rel="stylesheet"
    href="../../styles/admin/sidebar.css"
  />

  <link
    rel="stylesheet"
    href="../../styles/admin/admin-dashboard.css"
  />

  <link
    rel="stylesheet"
    href="../../styles/admin-announcements.css"
  />

  <!-- Student Attendance styles -->
  <link
    rel="stylesheet"
    href="../../styles/student/student-attendance.css"
  />
</head>

<body data-page="attendance">

  <!-- Floating sidebar toggle -->
  <button
    class="sidebar-float-toggle"
    id="sidebarFloatToggle"
    type="button"
    aria-label="Toggle sidebar"
  >
    ←
  </button>

  <div class="app">

    <!-- SIDEBAR -->
    <div id="sidebar-mount"></div>

    <main class="content">

      <!-- ==========================================
           TOP BAR
      =========================================== -->

      <header class="topbar">

        <div class="topbar-right">

          <div
            class="tb-user"
            id="userbox"
          >

            <img
              class="tb-avatar"
              src="../../assets/images/bg.jpg"
              alt="avatar"
            />

            <div class="tb-meta">

              <div class="tb-name">
                Student
              </div>

              <div class="tb-role">
                Attendance
              </div>

            </div>

            <button
              class="tb-drop"
              id="userMenuBtn"
              type="button"
              aria-label="Open user menu"
            >
              ▾
            </button>

            <div
              class="tb-menu"
              id="userMenu"
            >

              <button
                class="tb-item"
                type="button"
              >
                Settings
              </button>

              <button
                class="tb-item danger"
                type="button"
                id="topbarLogout"
              >
                Logout
              </button>

            </div>

          </div>

        </div>

      </header>

      <!-- ==========================================
           PAGE
      =========================================== -->

      <section class="teachers-wrap">

        <!-- PAGE HEADER -->

        <div class="teachers-page-head">

          <h2 class="teachers-title">
            Attendance
          </h2>

        </div>

        <!-- ==========================================
             MAIN CARD
        =========================================== -->

        <div class="card t-card att-card">

          <!-- ========================================
               CARD HEADER
          ========================================= -->

          <div class="t-card-head att-head">

            <div class="att-left">

              <div class="t-subtitle">
                Attendance Record
              </div>

              <!-- Grade Level + Section -->

              <div class="att-sub">

                <span id="attGradeSection">
                  Grade —
                </span>

              </div>

            </div>

            <!-- ======================================
                 FILTERS / VIEW TOGGLE
            ======================================= -->

            <div class="att-actions">

              <!-- Month -->

              <select
                id="attMonthSelect"
                class="t-filter"
                aria-label="Select month"
              >

                <option value="all">
                  Month: All
                </option>

                <option value="0">
                  January
                </option>

                <option value="1">
                  February
                </option>

                <option value="2">
                  March
                </option>

                <option value="3">
                  April
                </option>

                <option value="4">
                  May
                </option>

                <option value="5">
                  June
                </option>

                <option value="6">
                  July
                </option>

                <option value="7">
                  August
                </option>

                <option value="8">
                  September
                </option>

                <option value="9">
                  October
                </option>

                <option value="10">
                  November
                </option>

                <option value="11">
                  December
                </option>

              </select>

              <!-- Table / Calendar -->

              <div
                class="att-toggle"
                role="tablist"
                aria-label="Attendance view toggle"
              >

                <button
                  class="att-tab active"
                  id="attTabTable"
                  type="button"
                  role="tab"
                  aria-selected="true"
                >
                  Table
                </button>

                <button
                  class="att-tab"
                  id="attTabCalendar"
                  type="button"
                  role="tab"
                  aria-selected="false"
                >
                  Calendar
                </button>

              </div>

            </div>

          </div>

          <!-- ==========================================
               SUMMARY
          =========================================== -->

          <div
            class="att-summary"
            id="attSummary"
          >

            <!-- Present -->

            <div class="att-stat">

              <div class="att-stat-k">
                Present
              </div>

              <div
                class="att-stat-v"
                id="attPresent"
              >
                —
              </div>

            </div>

            <!-- Absent -->

            <div class="att-stat">

              <div class="att-stat-k">
                Absent
              </div>

              <div
                class="att-stat-v"
                id="attAbsent"
              >
                —
              </div>

            </div>

            <!-- Late -->

            <div class="att-stat">

              <div class="att-stat-k">
                Late
              </div>

              <div
                class="att-stat-v"
                id="attLate"
              >
                —
              </div>

            </div>

            <!-- Attendance Rate -->

            <div class="att-stat rate">

              <div class="att-stat-k">
                Attendance Rate
              </div>

              <div
                class="att-stat-v"
                id="attRate"
              >
                —
              </div>

            </div>

          </div>

          <!-- ==========================================
               ATTENDANCE BODY
          =========================================== -->

          <div class="att-body">

            <!-- ========================================
                 TABLE VIEW
            ========================================= -->

            <div id="attViewTable">

              <div class="att-table-wrap">

                <table class="att-table">

                  <thead>

                    <tr>

                      <th style="width: 220px;">
                        Date
                      </th>

                      <th style="width: 180px;">
                        Status
                      </th>

                    </tr>

                  </thead>

                  <tbody id="attTbody">
                    <!-- JS populates attendance records -->
                  </tbody>

                </table>

              </div>

            </div>

            <!-- ========================================
                 CALENDAR VIEW
            ========================================= -->

            <div
              id="attViewCalendar"
              class="hidden"
            >

              <div class="att-cal">

                <div class="att-cal-head">

                  <div
                    class="att-cal-title"
                    id="attCalTitle"
                  >
                    Month
                  </div>

                </div>

                <div
                  class="att-cal-grid"
                  id="attCalGrid"
                >
                  <!-- JS populates calendar -->
                </div>

              </div>

            </div>

            <!-- ========================================
                 EMPTY STATE
            ========================================= -->

            <div
              id="attEmpty"
              class="att-empty hidden"
            >
              No attendance record yet.
            </div>

          </div>

        </div>

      </section>

    </main>

  </div>

  <!-- ==========================================
       STUDENT SCRIPTS
  =========================================== -->

  <script src="../../js/student/student-sidebar.js"></script>

  <script src="../../js/student/student-attendance.js"></script>

</body>
</html>
