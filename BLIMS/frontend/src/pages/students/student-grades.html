<!-- frontend/src/pages/student/student-grades.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Student - Grades</title>

  <!-- Plus Jakarta Sans -->
  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  />

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  />

  <link
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap"
    rel="stylesheet"
  />

  <!-- Baseline styles -->
  <link
    rel="stylesheet"
    href="../../styles/admin/sidebar.css"
  />

  <link
    rel="stylesheet"
    href="../../styles/admin/admin-dashboard.css"
  />

  <link
    rel="stylesheet"
    href="../../styles/admin-announcements.css"
  />

  <!-- Student Grades -->
  <link
    rel="stylesheet"
    href="../../styles/student/student-grades.css"
  />
</head>

<body data-page="grades">

  <!-- Floating sidebar toggle -->
  <button
    class="sidebar-float-toggle"
    id="sidebarFloatToggle"
    type="button"
    aria-label="Toggle sidebar"
  >
    ←
  </button>

  <div class="app">

    <!-- Sidebar -->
    <div id="sidebar-mount"></div>

    <main class="content">

      <!-- =================================================
           TOP BAR
      ================================================== -->

      <header class="topbar">

        <div class="topbar-right">

          <div
            class="tb-user"
            id="userbox"
          >

            <img
              class="tb-avatar"
              src="../../assets/images/bg.jpg"
              alt="avatar"
            />

            <div class="tb-meta">

              <div class="tb-name">
                Student
              </div>

              <div class="tb-role">
                Grades
              </div>

            </div>

            <button
              class="tb-drop"
              id="userMenuBtn"
              type="button"
              aria-label="Open user menu"
            >
              ▾
            </button>

            <div
              class="tb-menu"
              id="userMenu"
            >

              <button
                class="tb-item"
                type="button"
              >
                Settings
              </button>

              <button
                class="tb-item danger"
                type="button"
                id="topbarLogout"
              >
                Logout
              </button>

            </div>

          </div>

        </div>

      </header>


      <!-- =================================================
           PAGE
      ================================================== -->

      <section class="teachers-wrap">

        <!-- Page heading -->
        <div class="teachers-page-head">

          <h2 class="teachers-title">
            Grades
          </h2>

        </div>


        <!-- =================================================
             MAIN CARD
        ================================================== -->

        <div class="card t-card grades-card">

          <!-- =================================================
               CARD HEADER
          ================================================== -->

          <div class="t-card-head grades-head">

            <div class="grades-left">

              <div class="t-subtitle">
                Academic Performance
              </div>

              <div class="grades-sub">

                <!-- Backend fills this -->
                <span id="gradesGradeSection">
                  Grade —
                </span>

              </div>

            </div>


            <!-- =================================================
                 TERM TABS
            ================================================== -->

            <div class="grades-actions">

              <div
                class="grades-tabs"
                id="gradesTabs"
                role="tablist"
                aria-label="Grade terms"
              >
                <!-- JS fills terms dynamically -->
              </div>

            </div>

          </div>


          <!-- =================================================
               SUMMARY
          ================================================== -->

          <div class="grades-summary">

            <div class="grades-sum-card">

              <div class="grades-sum-k">
                Final Average
              </div>

              <div
                class="grades-sum-v"
                id="finalAverage"
              >
                —
              </div>

            </div>


            <div class="grades-sum-card">

              <div class="grades-sum-k">
                Promotion Status
              </div>

              <div
                class="grades-sum-v"
                id="promotionStatus"
              >
                —
              </div>

            </div>

          </div>


          <!-- =================================================
               GRADES TABLE
          ================================================== -->

          <div class="grades-body">

            <div
              class="grades-table-wrap"
              id="gradesTableWrap"
            >

              <table class="grades-table">

                <thead>

                  <tr>

                    <th style="width: 55%;">
                      Subject
                    </th>

                    <th
                      style="
                        width: 20%;
                        text-align: right;
                      "
                    >
                      Grade
                    </th>

                    <th style="width: 25%;">
                      Remarks
                    </th>

                  </tr>

                </thead>

                <tbody id="gradesTbody">
                  <!-- JS fills -->
                </tbody>

              </table>

            </div>


            <!-- =================================================
                 EMPTY / LOADING STATE
            ================================================== -->

            <div
              id="gradesEmpty"
              class="grades-empty hidden"
            >
              No grades available yet.
            </div>

          </div>

        </div>

      </section>

    </main>

  </div>


  <!-- =====================================================
       STUDENT SIDEBAR
  ====================================================== -->

  <script
    src="../../js/student/student-sidebar.js"
  ></script>


  <!-- =====================================================
       STUDENT GRADES
  ====================================================== -->

  <script
    src="../../js/student/student-grades.js"
  ></script>

</body>
</html>
